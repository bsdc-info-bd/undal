# ---------------------------------------------------------------------------
# Undal HomeKitchen — Gradle daemon + Android flags
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX is mandatory for Jetpack Compose; non-transitive R keeps builds fast.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kapt.incremental.apt=true
kapt.use.worker.api=true
# Kotlin 2.1.20 turned on K2 kapt, and the Java files that kapt writes out carry
# Kotlin metadata that androidx.hilt:hilt-compiler 1.2.0 cannot read. Its
# processor depends on room-compiler-processing 2.6.0, whose metadata parser
# stops at "unsupported metadata kind: null" for every @HiltWorker class.
# The K1 kapt writer emits metadata that processor does read. Same flags
# either way, same generated code, no dependency version moved.
# Full story: google/dagger#4693.
kapt.use.k2=false

