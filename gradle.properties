# ---------------------------------------------------------------------------
# Undal HomeKitchen — Gradle daemon + Android flags
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX is mandatory for Jetpack Compose; non-transitive R keeps builds fast.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kapt.incremental.apt=true
kapt.use.worker.api=true

# ---------------------------------------------------------------------------
# Undal build inputs.
# CI (.github/workflows/android-build.yml) overrides these with repository
# secrets through -P flags; local builds use the values below.
# ---------------------------------------------------------------------------
UNDAL_CLOUDINARY_CLOUD_NAME=undal
UNDAL_CLOUDINARY_UPLOAD_PRESET=undal_unsigned
UNDAL_WORKER_BASE_URL=https://undal.YOUR-SUBDOMAIN.workers.dev
UNDAL_WORKER_HOST=undal.YOUR-SUBDOMAIN.workers.dev
UNDAL_FIREBASE_WEB_API_KEY=
UNDAL_SUPPORT_PHONE=
