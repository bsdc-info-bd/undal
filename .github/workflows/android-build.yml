# ===========================================================================
# Undal HomeKitchen — android-build
#
# push / pull request / manual. Produces the signed, installable undal.apk and
# (on main) publishes it to the rolling GitHub release so that
#   https://github.com/bsdc-info-bd/undal/releases/latest/download/undal.apk
# is always the newest build — the exact URL the Worker hands out.
# ===========================================================================
name: android-build

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - "FEATURES.md"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      minify:
        description: Enable R8 minify + resource shrinking for this build
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign undal.apk
    runs-on: ubuntu-latest
    env:
      UNDAL_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      UNDAL_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      UNDAL_WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      UNDAL_WORKER_HOST: ${{ secrets.WORKER_HOST }}
      UNDAL_FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      UNDAL_SUPPORT_PHONE: ${{ secrets.SUPPORT_PHONE }}
      UNDAL_MINIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.minify || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash tools/preflight.sh \
            GOOGLE_SERVICES_JSON CLOUDINARY_CLOUD_NAME CLOUDINARY_UPLOAD_PRESET \
            WORKER_BASE_URL WORKER_HOST KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD

      - name: No-placeholder gate (LAW-1)
        run: bash tools/check_no_placeholders.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare the build inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          mkdir -p app/src/main/res/raw
          cp assets/sound/undal_order_alert.mp3 app/src/main/res/raw/undal_order_alert.mp3
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "order sound: $(stat -c%s app/src/main/res/raw/undal_order_alert.mp3) bytes"

      - name: Unit tests
        run: |
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace \
            -PundalVersionCode=${{ github.run_number }} \
            -PundalVersionName=1.0.${{ github.run_number }}

      - name: Assemble signed-ready release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PundalVersionCode=${{ github.run_number }} \
            -PundalVersionName=1.0.${{ github.run_number }} \
            -PundalMinify=${UNDAL_MINIFY}

      - name: Keystore fingerprint
        id: fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/undal-release.jks"
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/undal-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "${{ secrets.KEY_ALIAS }}" \
            | awk -F': ' '/SHA256:/{print $2}' | head -1 | tr -d ' ')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $SHA"

      - name: Sign the release APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Publish the fixed asset name
        run: |
          cp "${{ steps.sign.outputs.signedReleaseFile }}" undal.apk
          ls -l undal.apk
          sha256sum undal.apk

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: undal-apk
          path: undal.apk
          retention-days: 30

      - name: Attach to the rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Undal HomeKitchen 1.0.${{ github.run_number }}
          make_latest: true
          files: undal.apk
          body: |
            Automated build from `${{ github.sha }}`.

            Download **undal.apk** and install it (Android will ask you to allow
            installs from this browser — that is expected for a direct APK).

            Order sound: official Undal alert (loops until the order is answered).
            Signing certificate SHA-256: `${{ steps.fingerprint.outputs.sha256 }}`

      - name: Tell the Worker about this release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: |
          if [ -z "$RELEASE_WEBHOOK_SECRET" ] || [ -z "$WORKER_BASE_URL" ]; then
            echo "Release webhook not configured yet — skipping (in-app update notice stays quiet)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$WORKER_BASE_URL/admin/release" \
            -H "content-type: application/json" \
            -H "x-undal-release-secret: $RELEASE_WEBHOOK_SECRET" \
            -d "{\"versionName\":\"1.0.${{ github.run_number }}\",\"versionCode\":${{ github.run_number }},\"notes\":\"Automated build ${{ github.run_number }}\"}"

      - name: Summarise
        run: |
          {
            echo "## Undal APK ready"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | 1.0.${{ github.run_number }} |"
            echo "| Download | https://github.com/${{ github.repository }}/releases/latest/download/undal.apk |"
            echo "| Signing SHA-256 | \`${{ steps.fingerprint.outputs.sha256 }}\` |"
            echo ""
            echo "Paste the SHA-256 into the **APP_SIGNING_SHA256** repository secret so App Links verify."
          } >> "$GITHUB_STEP_SUMMARY"
