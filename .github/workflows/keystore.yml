# ===========================================================================
# Undal HomeKitchen — keystore (run ONCE, from the phone browser)
#
# Generates the release signing keystore inside the runner, prints the four
# values the owner must store as repository secrets, and attaches the keystore
# as a downloadable artifact. The keystore never exists on anyone's laptop.
#
# Keep the artifact: without it you cannot publish an update that Android will
# accept (the signature must match on every future release).
# ===========================================================================
name: keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: Key alias for the release certificate
        type: string
        default: undal

permissions:
  contents: read

jobs:
  generate:
    name: Generate the Undal release keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore and print the secrets
        id: generate
        env:
          ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)

          keytool -genkeypair -v \
            -keystore undal-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Undal HomeKitchen, OU=Kitchen, O=Undal HomeKitchen, L=Sylhet, ST=Sylhet, C=BD"

          BASE64_KEYSTORE=$(base64 -w0 undal-release.jks)
          SHA256=$(keytool -list -v -keystore undal-release.jks -storepass "$STORE_PASSWORD" -alias "$ALIAS" \
            | awk -F': ' '/SHA256:/{print $2}' | head -1 | tr -d ' ')

          {
            echo "## Undal release keystore generated"
            echo ""
            echo "Copy each value into GitHub → Settings → Secrets and variables → Actions."
            echo ""
            echo "### KEYSTORE_PASSWORD"
            echo '```'
            echo "$STORE_PASSWORD"
            echo '```'
            echo "### KEY_PASSWORD"
            echo '```'
            echo "$KEY_PASSWORD"
            echo '```'
            echo "### KEY_ALIAS"
            echo '```'
            echo "$ALIAS"
            echo '```'
            echo "### APP_SIGNING_SHA256 (same value the android-build workflow prints)"
            echo '```'
            echo "$SHA256"
            echo '```'
            echo "### KEYSTORE_BASE64"
            echo '```'
            echo "$BASE64_KEYSTORE"
            echo '```'
            echo ""
            echo "Download the **undal-release** artifact below and keep it somewhere safe."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "keystore generated; SHA-256 ${SHA256}"

      - name: Upload the keystore
        uses: actions/upload-artifact@v4
        with:
          name: undal-release-keystore
          path: undal-release.jks
          retention-days: 90
