# ===========================================================================
# Undal HomeKitchen — deploy-worker
#
# Deploys the Cloudflare Worker (FCM v1 relay, crons, web store, deep links).
# The KV namespace is looked up by title and created automatically, so the owner
# only ever pastes a Cloudflare API token and account id.
# ===========================================================================
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "firebase/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the Undal Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: |
          bash tools/preflight.sh \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_SA_JSON FIREBASE_RTDB_URL CLOUDINARY_CLOUD_NAME

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker toolchain
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Typecheck the worker
        working-directory: worker
        run: npm run typecheck

      # The re-alert sweep is the reason a phone that slept through the first
      # push still rings, and its failure modes are silent in both directions.
      # Node runs the TypeScript directly, so this tests the deployed code.
      - name: Test the worker
        working-directory: worker
        run: npm test
        
      - name: Resolve the KV namespace id
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"

          # Cloudflare answers HTTP 200 with `"result": null` when the token or
          # the account id is wrong. Reading that as an empty list is what
          # produced "TypeError: 'NoneType' object is not iterable" — a traceback
          # is not an error message, least of all on a phone. This reads the
          # answer properly and says what to repair.
          #
          # The reader lives in a file rather than a heredoc: `python3 -` takes
          # its *program* from stdin, which would leave nothing for the JSON.
          cat > "$RUNNER_TEMP/read-cloudflare.py" <<'PY'
          import json
          import sys

          wanted = sys.argv[1]
          raw = sys.stdin.read()
          try:
              payload = json.loads(raw)
          except ValueError:
              print("Cloudflare did not answer with JSON. Body starts: %s" % raw[:200], file=sys.stderr)
              raise SystemExit(1)

          if not payload.get("success"):
              details = "; ".join(
                  "%s %s" % (error.get("code"), error.get("message"))
                  for error in (payload.get("errors") or [])
              ) or "no detail given"
              print("Cloudflare refused the KV request: %s" % details, file=sys.stderr)
              print(
                  "Repair: CLOUDFLARE_API_TOKEN needs the Workers KV Storage: Edit permission, "
                  "and CLOUDFLARE_ACCOUNT_ID must be the account that owns this Worker.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          result = payload.get("result")
          if wanted == "list":
              for namespace in (result or []):
                  if namespace.get("title") == "undal-kv":
                      print(namespace.get("id") or "")
                      break
          else:
              print((result or {}).get("id") or "")
          PY

          fetch() {
            # $1 method · $2 url · $3 body file · $4 what we were doing
            local status
            if [ "$1" = "POST" ]; then
              status=$(curl -sS -o "$3" -w "%{http_code}" -X POST "$2" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "content-type: application/json" -d '{"title":"undal-kv"}')
            else
              status=$(curl -sS -o "$3" -w "%{http_code}" "$2" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            fi
            if [ "$status" -ge 400 ]; then
              echo "Cloudflare answered HTTP ${status} while ${4}." >&2
              echo "Body: $(head -c 400 "$3")" >&2
              if [ "$status" = "403" ]; then
                echo "Repair: give CLOUDFLARE_API_TOKEN the Workers KV Storage: Edit permission." >&2
              fi
              exit 1
            fi
          }

          fetch GET "${API}?per_page=100" "$RUNNER_TEMP/kv-list.json" "listing KV namespaces"
          ID=$(python3 "$RUNNER_TEMP/read-cloudflare.py" list < "$RUNNER_TEMP/kv-list.json")

          if [ -z "$ID" ]; then
            fetch POST "$API" "$RUNNER_TEMP/kv-create.json" "creating the KV namespace"
            ID=$(python3 "$RUNNER_TEMP/read-cloudflare.py" created < "$RUNNER_TEMP/kv-create.json")
            if [ -z "$ID" ]; then
              echo "Cloudflare accepted the request but returned no namespace id." >&2
              echo "Repair: CLOUDFLARE_API_TOKEN needs Workers KV Storage: Edit on this account," >&2
              echo "and CLOUDFLARE_ACCOUNT_ID must be the account id shown on the Workers dashboard." >&2
              exit 1
            fi
            echo "created KV namespace undal-kv ($ID)"
          else
            echo "reusing KV namespace undal-kv ($ID)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Render wrangler.toml for this account
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          GITHUB_REPO_SLUG: ${{ github.repository }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -euo pipefail
          sed -i "s|REPLACE_KV_NAMESPACE_ID|${KV_ID}|g" worker/wrangler.toml
          sed -i "s|REPLACE_CLOUDINARY_CLOUD_NAME|${CLOUDINARY_CLOUD_NAME}|g" worker/wrangler.toml
          sed -i "s|REPLACE_GITHUB_REPO_SLUG|${GITHUB_REPO_SLUG}|g" worker/wrangler.toml
          sed -i "s|REPLACE_FIREBASE_WEB_API_KEY|${FIREBASE_WEB_API_KEY:-}|g" worker/wrangler.toml
          grep -n "KV_NAMESPACE_ID\|CLOUDINARY_CLOUD_NAME\|GITHUB_REPO_SLUG" worker/wrangler.toml
          if [ -n "${FIREBASE_WEB_API_KEY:-}" ]; then
            echo "Web checkout: enabled (FIREBASE_WEB_API_KEY set)."
          else
            echo "Web checkout: parked — FIREBASE_WEB_API_KEY is blank, so /checkout tells visitors to install the app."
          fi

      - name: Push worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          FIREBASE_RTDB_URL: ${{ secrets.FIREBASE_RTDB_URL }}
          APP_SIGNING_SHA256: ${{ secrets.APP_SIGNING_SHA256 }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SA_JSON" | npx wrangler secret put FIREBASE_SA_JSON --name undal
          printf '%s' "$FIREBASE_RTDB_URL" | npx wrangler secret put FIREBASE_RTDB_URL --name undal
          printf '%s' "${APP_SIGNING_SHA256:-}" | npx wrangler secret put APP_SIGNING_SHA256 --name undal
          printf '%s' "${RELEASE_WEBHOOK_SECRET:-}" | npx wrangler secret put RELEASE_WEBHOOK_SECRET --name undal

      # The Worker's queries need composite indexes, and an index is a deployment
      # step in a *different* system: `seed-config` deploys them, `deploy-worker`
      # deploys the code that needs them. A project that ran seed-config before an
      # index was added answers those queries with 400 FAILED_PRECONDITION — which
      # is exactly how "Clear finished history" came to answer HTTP 502 forever.
      #
      # So the indexes now ship with the code that queries them. This is a
      # convenience, not a dependency: the cleanup route falls back to an
      # index-free scan when the index is missing, and says so in its response, so
      # a failure here is a warning rather than a broken deploy.
      - name: Deploy the Firestore indexes this Worker queries
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          set -uo pipefail
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "FIREBASE_SA_JSON is not set — skipping the index deploy."
            echo "The Worker still works: the history cleanup falls back to an index-free scan."
            exit 0
          fi
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/undal-sa.json"
          project=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/undal-sa.json")
          echo "Deploying firebase/firestore.indexes.json to $project"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/undal-sa.json"
          npm install --global firebase-tools@13 >/dev/null 2>&1
          if firebase deploy --only firestore:indexes --project "$project" --non-interactive; then
            echo "Indexes submitted. Firestore builds them in the background; the cleanup route"
            echo "uses its index-free scan until they are ready, so nothing is blocked."
          else
            echo "::warning::The Firestore indexes could not be deployed. Run the seed-config workflow by hand. Undal falls back to an index-free scan in the meantime."
          fi
          rm -f "$RUNNER_TEMP/undal-sa.json"

      - name: Dry-run bundle
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # The smoke test is the only thing that proves the deployed Worker answers
      # at all, so it has to be right about the URL it asks for. It was not: a
      # trailing slash in the secret produced "https://host//healthz", which the
      # Worker treats as an unknown route — a deploy that worked reported itself
      # as broken, which is worse than no check at all.
      #
      # It also tests the route this deploy just added, not only the health probe:
      # an order alert that cannot be sent is exactly the failure the alert
      # ladder exists to prevent, and the endpoint answers without a caller
      # token (401) when it is reachable, which is the fact being checked.
      - name: Smoke test the deployment
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: |
          if [ -z "$WORKER_BASE_URL" ]; then
            echo "WORKER_BASE_URL secret is not set yet — skipping the smoke test."
            exit 0
          fi
          base="${WORKER_BASE_URL%/}"
          echo "smoke testing $base"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' "$base/healthz" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/healthz.json
              echo ""
              echo "healthz responded."
              break
            fi
            echo "attempt $i: healthz answered ${code:-nothing}"
            sleep 6
          done
          if [ "${code:-}" != "200" ]; then
            echo "healthz did not respond in time — check the wrangler output above."
            echo "  (a 404 here usually means WORKER_BASE_URL has a path or a trailing slash)"
            exit 1
          fi

          # The notify relay must exist. A caller without a token gets 401/403,
          # which proves the route is mounted and the auth guard is on; 404 means
          # this deployment is missing the alert endpoint entirely.
          relay=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' "$base/notify/test-alert" || true)
          case "$relay" in
            401|403) echo "/notify/test-alert is mounted and guarded ($relay)." ;;
            *) echo "/notify/test-alert answered ${relay:-nothing} — expected 401/403 for a caller with no token."
               exit 1 ;;
          esac

      - name: Summarise
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: |
          {
            echo "## Undal Worker deployed"
            echo ""
            echo "- Cron 1: \`*/5 * * * *\` — vendor presence watchdog (auto-offline after 15 minutes)."
            echo "- Cron 2: \`0 12 * * *\` = 18:00 Asia/Dhaka — daily offer broadcast to \`promos_all\`."
            echo "- Health: ${WORKER_BASE_URL}/healthz"
            echo "- Deep links: ${WORKER_BASE_URL}/dish/{id} · /combo/{id} · /order/{id} · /app"
          } >> "$GITHUB_STEP_SUMMARY"
