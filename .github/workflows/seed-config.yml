# ===========================================================================
# Undal HomeKitchen — seed-config (run once, re-runnable at any time)
#
# Publishes the real bootstrap documents the app needs on first launch:
#   config/store    store identity, weekly hours, delivery economics, kitchen pin
#   config/promos   the offer rotation the 18:00 cron walks through
#   categories/menuItems source-backed dishes, created only when missing
#   counters/orders shortId generator starting at UND-1001
# and deploys the Firestore rules/indexes plus the Realtime Database rules with
# the Firebase CLI (the owner never types a command — Actions does it).
# ===========================================================================
name: seed-config

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-config
  cancel-in-progress: false

jobs:
  seed:
    name: Publish config and security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: bash tools/preflight.sh FIREBASE_SA_JSON

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate rule files
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in ["firebase/firestore.indexes.json", "firebase/database.rules.json", "firebase.json"]:
              json.loads(pathlib.Path(path).read_text())
              print(f"valid JSON: {path}")
          rules = pathlib.Path("firebase/firestore.rules").read_text()
          assert "rules_version = '2';" in rules, "firestore.rules must declare rules_version 2"
          assert "service cloud.firestore" in rules
          print("valid structure: firebase/firestore.rules")
          PY

      - name: Write the service account
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Validate source-backed menu catalogue
        run: node tools/check-undal-menu.mjs

      - name: Seed Firestore bootstrap documents
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          node tools/seed-config.mjs
          node tools/seed-menu.mjs

      - name: Deploy Firestore rules, indexes and Realtime Database rules
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,database \
            --project "$(python3 -c "import json,os;print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['project_id'])")" \
            --non-interactive

      - name: Summarise
        run: |
          {
            echo "## Undal config published"
            echo ""
            echo "- Firestore rules, indexes and RTDB rules deployed."
            echo "- config/store, config/promos and counters/orders are present."
            echo "- The source-backed menu catalogue was created only for missing documents; existing vendor edits were preserved."
            echo "- New dishes start unavailable until the kitchen verifies current prices, options, photos and stock."
            echo "- The kitchen pin defaults to Zindabazar, Sylhet — move it with the store-location picker in the vendor app."
          } >> "$GITHUB_STEP_SUMMARY"
